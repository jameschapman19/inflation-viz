name: Refresh energy and fuel observations

on:
  schedule:
    # DESNZ normally publishes Tuesday morning; also available on demand.
    - cron: "0 10 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: published-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --dev
      - name: Archive published energy and fuel observations
        run: uv run python -m inflation_viz.drivers
      - name: Commit observations
        run: |
          git config user.name "inflation-viz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/drivers/
          git diff --cached --quiet || git commit -m "data: refresh energy and fuel observations"
          git pull --rebase
          git push
