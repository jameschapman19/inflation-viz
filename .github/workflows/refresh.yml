name: Refresh data

on:
  schedule:
    # Daily — ONS itself only republishes monthly, but this keeps the site
    # current without needing to know the exact release calendar.
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Fetch latest data and export it for the web app
        run: uv run python -m inflation_viz.refresh

      - name: Commit updated data
        run: |
          git config user.name "inflation-viz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ web/src/data/
          git diff --cached --quiet || git commit -m "data: refresh vintage $(date -u +%Y-%m-%dT%H%M%SZ)"
          git push
