# sources.yaml — non-ONS-timeseries reference sources for Inflation Radar (UK)
#
# Every ONS CPI/CPIH series this app uses — headline, all 12 COICOP
# divisions, and the full sub-division tree down to whatever depth ONS
# itself publishes a rate and/or weight for — is discovered LIVE at refresh
# time by src/inflation_viz/ons_catalog.py, which parses ONS's own bulk
# mm23 dataset. No CDID is hardcoded anywhere in this pipeline; if ONS
# adds, retires, or renames a series, the next scheduled refresh picks
# that up automatically. See ons_catalog.py's module docstring for exactly
# how a title string becomes a series, and tests/test_ons_catalog.py for
# the parsing/classification logic it's tested against.
#
# Besides `external:` (reference tables with no CDID timeseries API at
# all), there's also `context:` — a small number of hand-curated *non-CPI*
# ONS series that give the headline inflation numbers context. Each one
# does have a live ONS timeseries JSON API, fetched and exported exactly
# like every CPI series in this pipeline — it's just a different ONS
# dataset/theme than mm23, and there's no bulk catalog to auto-discover a
# single named series from, so (like `external`) its CDID is typed by
# hand here rather than discovered.

license_defaults:
  ons_ogl: &ons_ogl "Open Government Licence v3.0"

context:
  real_wage_growth:
    unique_id: GB.WAGE.REAL
    name: "AWE: Whole Economy Real Terms Year-on-Year 3-Month Average Growth: Regular Pay (SA)"
    cdid: A2FA
    dataset: lms
    theme_path: employmentandlabourmarket/peopleinwork/earningsandworkinghours
    source_name: "Office for National Statistics"
    license: *ons_ogl
    cadence: monthly
    unit: percent

external:
  ofgem_price_cap:
    name: "Ofgem energy price cap level and effective dates"
    source_name: "Ofgem"
    source_url: "https://www.ofgem.gov.uk/energy-price-cap"
    license: "Check Ofgem terms of use"
    cadence: per_cap_period
    notes: "Not ingested in v1. Reserved for inflation-forecast's housing/energy exogenous regressor."

  fuel_prices:
    name: "Weekly road fuel prices"
    source_name: "Department for Energy Security and Net Zero (DESNZ)"
    source_url: "https://www.gov.uk/government/statistics/weekly-road-fuel-prices"
    license: *ons_ogl
    cadence: weekly
    notes: "Not ingested in v1. Reserved for inflation-forecast's transport exogenous regressor."
