# ---------------------------------------------------------------------------
# Out of scope for v1 ingestion — recorded here so the schema anticipates
# them (Phase 2 exogenous regressors: Ofgem price cap, fuel prices) without
# requiring a registry rewrite when they're built.
# ---------------------------------------------------------------------------
external:
  ofgem_price_cap:
    name: "Ofgem energy price cap level and effective dates"
    source_name: "Ofgem"
    source_url: "https://www.ofgem.gov.uk/energy-price-cap"
    license: "Check Ofgem terms of use"
    cadence: per_cap_period
    notes: "Not ingested in v1. Reserved for inflation-forecast's housing/energy exogenous regressor."

  fuel_prices:
    name: "Weekly road fuel prices"
    source_name: "Department for Energy Security and Net Zero (DESNZ)"
    source_url: "https://www.gov.uk/government/statistics/weekly-road-fuel-prices"
    license: *ons_ogl
    cadence: weekly
    notes: "Not ingested in v1. Reserved for inflation-forecast's transport exogenous regressor."
