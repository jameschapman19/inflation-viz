# sources.yaml — canonical source registry for Inflation Radar (UK)
#
# Every fetcher in src/inflation_viz reads this file; no series or CDID is
# hardcoded anywhere else in the pipeline. This file also drives the
# methodology/sources page — the "view source" link behind every chart.
#
# CDIDs were resolved via the ONS series search (ons.gov.uk) and each entry's
# `source_url` is the human-readable ONS page for that series; `api_url` is
# the machine-readable JSON endpoint the fetcher calls.

license_defaults:
  ons_ogl: &ons_ogl "Open Government Licence v3.0"

# ---------------------------------------------------------------------------
# Headline rates
# ---------------------------------------------------------------------------
headline:
  GB.CPI:
    name: "CPI: All items 12-month rate"
    cdid: D7G7
    dataset: mm23
    source_name: "Office for National Statistics"
    source_url: "https://www.ons.gov.uk/economy/inflationandpriceindices/timeseries/d7g7/mm23"
    api_url: "https://www.ons.gov.uk/economy/inflationandpriceindices/timeseries/d7g7/mm23/data"
    license: *ons_ogl
    cadence: monthly
    unit: percent

  GB.CPIH:
    name: "CPIH: All items 12-month rate"
    cdid: L55O
    dataset: mm23
    source_name: "Office for National Statistics"
    source_url: "https://www.ons.gov.uk/economy/inflationandpriceindices/timeseries/l55o/mm23"
    api_url: "https://www.ons.gov.uk/economy/inflationandpriceindices/timeseries/l55o/mm23/data"
    license: *ons_ogl
    cadence: monthly
    unit: percent

# ---------------------------------------------------------------------------
# Per-division "contribution to annual rate" series (12 COICOP divisions)
