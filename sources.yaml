# ---------------------------------------------------------------------------
# COICOP sub-division rates (below the 2-digit division level)
#
# ONS's own "contribution to annual rate" series (the `divisions:` section
# above) only exists at the 2-digit division level — there is no published
# ppt-contribution series for a group or class. Below that level ONS
# publishes INDEX, ANNUAL RATE, and WEIGHT series instead, so `metric` here
# is the sub-division's own 12-month rate of change (not its contribution to
# headline CPI) — a different thing, labelled as such throughout the site.
# We consume the published rate as-is rather than deriving it from the
# index ourselves, for the same point-in-time-integrity reason the top-level
# divisions use ONS's own contribution series.
#
# Coverage: every COICOP group (3-digit) ONS actually publishes a CPI rate
# and weight for, across all 12 divisions, plus two worked examples of
# going deeper than the group level: one class nested under Transport
# (07.2.2, "Fuels and lubricants") and Food's full class-level breakdown
# (01.1.1 through 01.1.9, e.g. "Bread and cereals", "Meat", "Fish" —
# nested under the 01.1 group). Each CDID here was
# cross-checked against multiple ONS search results before being added — a
# CDID guessed wrong would silently mislabel a real chart, so only entries
# with a directly-found ONS series page went in. Two things are
# deliberately absent rather than guessed:
#   - Education (10.x): ONS publishes the group-level INDEX and WEIGHT, but
#     no ANNUAL RATE CDID for either of the two published groups
#     ("10.1/2/5" and 10.4) could be confirmed — so education stays at the
#     division level (WUND/CJUU) rather than including an unverified rate.
#   - 04.2 "Imputed rentals for housing": not part of CPI's own basket at
#     all (only CPIH's) — that's the actual CPI/CPIH methodological split,
#     not an oversight.
# `parent_coicop` is the immediate parent in the COICOP tree (used to
# derive the sub-division's color and its breadcrumb). "08.2-3" is ONS's
# own combined series for Communication's 08.2 (equipment) + 08.3
# (services) groups, published as one series since equipment's weight
# is now too small to break out — the hyphen (not ONS's own "08.2/3") is
# just to keep it a valid URL path segment.
# ---------------------------------------------------------------------------
subdivisions:
  GB.CP01.1:
    coicop: "01.1"
    parent_coicop: "01"
    division_name: "Food"
    metric: annual_rate
    cdid: D7GK
    dataset: mm23
    source_name: "Office for National Statistics"
    source_url: "https://www.ons.gov.uk/economy/inflationandpriceindices/timeseries/d7gk/mm23"
