# ---------------------------------------------------------------------------
# Current live basket weights (COICOP division level, per mille)
#
# ONS publishes each division's weight as its own stable CDID in mm23 (same
# dataset, same endpoint as everything else above) rather than only as a
# downloadable workbook — so these are fetched exactly like the contribution
# series, not scraped. The weight itself only changes once a year (each
# Jan/Feb basket update) but is republished monthly; the site takes the
# latest observation.
# ---------------------------------------------------------------------------
weights:
  GB.W01:
    coicop: "01"
    division_name: "Food and non-alcoholic beverages"
    metric: basket_weight
    cdid: CHZR
    dataset: mm23
    source_name: "Office for National Statistics"
    source_url: "https://www.ons.gov.uk/economy/inflationandpriceindices/timeseries/chzr/mm23"
    api_url: "https://www.ons.gov.uk/economy/inflationandpriceindices/timeseries/chzr/mm23/data"
    license: *ons_ogl
    cadence: monthly
    unit: per_mille

